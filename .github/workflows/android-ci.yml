
name: AI Architecture Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, JVM Tests, Lint and Emulator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PROJECT_ROOT: ${{ github.workspace }}/AI_Architecture
      STATUS_DIR: ${{ github.workspace }}/.ci-ai-architecture-status

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK without deprecated tools
        id: sdk
        shell: bash
        run: |
          set -Eeuo pipefail

          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [[ ! -d "$ANDROID_HOME/cmdline-tools" ]]; then
            echo "::error::Android command-line tools directory missing"
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -perm -u+x -print -quit)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager executable not found"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -print || true
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

          echo "Using sdkmanager: $SDKMANAGER"

          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e

          if [[ "$LICENSE_STATUS" -ne 0 ]]; then
            echo "::error::Android SDK license acceptance failed"
            exit "$LICENSE_STATUS"
          fi

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/system-images/android-35/google_apis/x86_64"

          adb version
          echo "ANDROID_SDK_INSTALL=PASS"

      - name: Set up Gradle 8.11.1
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate source and CI scripts
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          test -f "$GITHUB_WORKSPACE/.github/scripts/run-emulator-tests.sh"
          test -f "$GITHUB_WORKSPACE/ci/verify-test-reports.py"

          mkdir -p "$STATUS_DIR"

          chmod +x "$GITHUB_WORKSPACE/.github/scripts/run-emulator-tests.sh"

          bash -n "$GITHUB_WORKSPACE/.github/scripts/run-emulator-tests.sh"
          python3 -m py_compile "$GITHUB_WORKSPACE/ci/verify-test-reports.py"

          cd "$PROJECT_ROOT"

          python3 scripts/verify_project.py
          python3 scripts/verify_phase2.py
          python3 scripts/verify_phase2_closeout.py
          python3 scripts/verify_build_readiness.py

          echo "SOURCE_VALIDATION=PASS"

      - name: Verify Android instrumentation configuration
        id: test_config
        shell: bash
        run: |
          set -Eeuo pipefail

          APP_GRADLE="$PROJECT_ROOT/app/build.gradle.kts"

          grep -Fq 'androidx.test.runner.AndroidJUnitRunner' "$APP_GRADLE"
          grep -Fq 'androidTestImplementation' "$APP_GRADLE"

          test -d "$PROJECT_ROOT/app/src/androidTest"

          find "$PROJECT_ROOT/app/src/androidTest" \
            -type f \( -name '*.kt' -o -name '*.java' \) -print

          echo "TEST_CONFIGURATION=PASS"

      - name: Assemble Debug and Android Test APKs
        id: assemble
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          gradle --no-daemon --stacktrace \
            :app:compileDebugAndroidTestKotlin \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest

          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

          sha256sum \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Run JVM Unit Tests
        id: unit
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest

      - name: Run Android Lint
        id: lint
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          gradle --no-daemon --stacktrace \
            :app:lintDebug

      - name: Mark emulator step as scheduled
        id: emulator_scheduled
        if: steps.assemble.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$STATUS_DIR"

          printf 'SCHEDULED\n' \
            > "$STATUS_DIR/emulator-step-scheduled.txt"

      - name: Boot API 35 Emulator and run instrumentation tests
        id: emulator
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PROJECT_ROOT: ${{ env.PROJECT_ROOT }}
          STATUS_DIR: ${{ env.STATUS_DIR }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          emulator-boot-timeout: 900
          script: bash "$GITHUB_WORKSPACE/.github/scripts/run-emulator-tests.sh"

      - name: Verify APKs and test reports
        id: reports
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 "$GITHUB_WORKSPACE/ci/verify-test-reports.py" \
            --project-root "$PROJECT_ROOT" \
            --status-dir "$STATUS_DIR"

      - name: Final CI Summary
        id: summary
        if: always()
        shell: bash
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          JAVA: ${{ steps.java.outcome }}
          SDK: ${{ steps.sdk.outcome }}
          GRADLE: ${{ steps.gradle.outcome }}
          SOURCE: ${{ steps.source.outcome }}
          TEST_CONFIG: ${{ steps.test_config.outcome }}
          ASSEMBLE: ${{ steps.assemble.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          LINT: ${{ steps.lint.outcome }}
          EMULATOR: ${{ steps.emulator.outcome }}
          REPORTS: ${{ steps.reports.outcome }}
        run: |
          set -u

          mkdir -p "$STATUS_DIR"

          {
            echo "========== AI ARCHITECTURE CI SUMMARY =========="
            echo "CHECKOUT=$CHECKOUT"
            echo "JDK17=$JAVA"
            echo "ANDROID_SDK_SETUP=$SDK"
            echo "GRADLE=$GRADLE"
            echo "SOURCE_VALIDATION=$SOURCE"
            echo "TEST_CONFIGURATION=$TEST_CONFIG"
            echo "APK_ASSEMBLY=$ASSEMBLE"
            echo "JVM_UNIT_TESTS=$UNIT"
            echo "ANDROID_LINT=$LINT"
            echo "EMULATOR_STEP=$EMULATOR"
            echo "REPORT_VERIFICATION=$REPORTS"
          } | tee "$STATUS_DIR/final-ci-summary.txt"

          RESULT=0

          for VALUE in \
            "$CHECKOUT" "$JAVA" "$SDK" "$GRADLE" \
            "$SOURCE" "$TEST_CONFIG" "$ASSEMBLE" \
            "$UNIT" "$LINT" "$EMULATOR" "$REPORTS"
          do
            [[ "$VALUE" == "success" ]] || RESULT=1
          done

          if [[ "$RESULT" -eq 0 ]]; then
            echo "FINAL_RESULT=PASS" | tee -a "$STATUS_DIR/final-ci-summary.txt"
          else
            echo "::error::FINAL_RESULT=FAIL"
            echo "FINAL_RESULT=FAIL" | tee -a "$STATUS_DIR/final-ci-summary.txt"
          fi

          exit "$RESULT"

      - name: Upload APKs, reports and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-architecture-ci-diagnostics
          if-no-files-found: warn
          path: |
            AI_Architecture/app/build/outputs/apk/**/*.apk
            AI_Architecture/app/build/reports/**
            AI_Architecture/app/build/test-results/**
            AI_Architecture/app/build/outputs/androidTest-results/**
            .ci-ai-architecture-status/**
