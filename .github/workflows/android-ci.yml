
name: AI Architecture Android Build and Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-architecture-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android compile, Room, tests, emulator and Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      ANDROID_API: '36'
      BUILD_TOOLS_VERSION: '36.0.0'
      GRADLE_VERSION: '8.11.1'
      KOTLIN_COMPILER_VERSION: '1.9.0'
      LOG_DIR: ${{ github.workspace }}/.ci-logs

    steps:
      - name: Checkout source
        id: checkout
        uses: actions/checkout@v4

      - name: Locate Android project root
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -f "$GITHUB_WORKSPACE/settings.gradle.kts" && -f "$GITHUB_WORKSPACE/app/build.gradle.kts" ]]; then
            PROJECT_ROOT="$GITHUB_WORKSPACE"
          elif [[ -f "$GITHUB_WORKSPACE/AI_Architecture/settings.gradle.kts" && -f "$GITHUB_WORKSPACE/AI_Architecture/app/build.gradle.kts" ]]; then
            PROJECT_ROOT="$GITHUB_WORKSPACE/AI_Architecture"
          else
            SETTINGS_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 5 -name settings.gradle.kts -not -path '*/.gradle/*' -print -quit)"
            [[ -n "$SETTINGS_FILE" ]] || {
              echo "Android project root not found"
              exit 1
            }
            PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          fi

          [[ -f "$PROJECT_ROOT/app/build.gradle.kts" ]]

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Located PROJECT_ROOT=$PROJECT_ROOT"

      - name: Set up JDK 17
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up pinned Gradle 8.11.1
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: false

      - name: Set up Android SDK
        id: android_sdk
        uses: android-actions/setup-android@v3

      - name: Install Android API 36, Build Tools and Platform Tools
        id: sdk_packages
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$LOG_DIR"

          yes | sdkmanager --licenses 2>&1 | tee "$LOG_DIR/android-sdk-licenses.log"

          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'emulator' \
            'system-images;android-36;google_apis;x86_64' \
            2>&1 | tee "$LOG_DIR/android-sdk-install.log"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/system-images/android-36/google_apis/x86_64"

          echo "ANDROID_SDK_INSTALL=PASS"

      - name: Install Kotlin/JVM compiler 1.9.0 for PSI guard
        id: kotlin_compiler
        shell: bash
        run: |
          set -Eeuo pipefail

          KOTLIN_HOME="$RUNNER_TEMP/kotlin-compiler-$KOTLIN_COMPILER_VERSION"
          ARCHIVE="$RUNNER_TEMP/kotlin-compiler-$KOTLIN_COMPILER_VERSION.zip"

          curl --fail --location --retry 3 \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_COMPILER_VERSION}/kotlin-compiler-${KOTLIN_COMPILER_VERSION}.zip" \
            --output "$ARCHIVE"

          unzip -q "$ARCHIVE" -d "$KOTLIN_HOME"

          echo "$KOTLIN_HOME/kotlinc/bin" >> "$GITHUB_PATH"
          echo "KOTLIN_HOME=$KOTLIN_HOME/kotlinc" >> "$GITHUB_ENV"

          test -x "$KOTLIN_HOME/kotlinc/bin/kotlinc"
          test -s "$KOTLIN_HOME/kotlinc/lib/kotlin-compiler.jar"

          "$KOTLIN_HOME/kotlinc/bin/kotlinc" -version 2>&1 \
            | tee "$LOG_DIR/kotlin-compiler-version.log"

          sha256sum "$KOTLIN_HOME/kotlinc/lib/kotlin-compiler.jar" \
            | tee "$LOG_DIR/kotlin-compiler-jar.sha256"

      - name: Verify build environment
        id: environment
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$LOG_DIR"

          {
            echo "=== Java ==="
            java -version 2>&1

            echo "=== Gradle ==="
            gradle --version

            echo "=== Kotlin/JVM ==="
            kotlinc -version 2>&1

            echo "=== Android SDK ==="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

            echo "=== SDK packages ==="
            sdkmanager --list_installed

            echo "=== ADB ==="
            adb version
          } 2>&1 | tee "$LOG_DIR/environment.txt"

          gradle --version | grep -F 'Gradle 8.11.1'
          java -version 2>&1 | grep -F '17.'
          kotlinc -version 2>&1 | grep -F '1.9.0'

          test -s "$KOTLIN_HOME/lib/kotlin-compiler.jar"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Resolve Gradle dependencies
        id: dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --stacktrace --console=plain \
            :app:dependencies \
            2>&1 | tee "$LOG_DIR/dependency-resolution.log"

      - name: Run V7 PSI and Tokenizer fixtures
        id: reflection_fixtures
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 scripts/test_dao_reflection_guard.py \
            2>&1 | tee "$LOG_DIR/dao-reflection-fixtures.log"

          grep -Fx 'PSI_RUNTIME=AVAILABLE' "$LOG_DIR/dao-reflection-fixtures.log"
          grep -Fx 'PSI_COMPILATION=SUCCESS' "$LOG_DIR/dao-reflection-fixtures.log"
          grep -Fx 'PSI_FIXTURES=EXECUTED' "$LOG_DIR/dao-reflection-fixtures.log"
          grep -Fx 'TOKENIZER_FIXTURES=EXECUTED' "$LOG_DIR/dao-reflection-fixtures.log"
          grep -Fx 'RESULT=TOKENIZER_AND_PSI_FIXTURES_PASS' "$LOG_DIR/dao-reflection-fixtures.log"

      - name: Run existing static verifiers
        id: static_verifiers
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$LOG_DIR"

          for script in \
            scripts/verify_build_readiness.py \
            scripts/verify_project.py \
            scripts/verify_phase2.py \
            scripts/verify_phase2_closeout.py \
            scripts/verify_phase1_sqlite_migrations.py
          do
            log="$LOG_DIR/$(basename "${script%.py}").log"

            echo "===== RUN $script ====="

            python3 "$script" 2>&1 | tee "$log"
          done

      - name: Compile Kotlin and execute Room KAPT schema generation
        id: compile_kapt
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$LOG_DIR"

          gradle --no-daemon --stacktrace --console=plain \
            :app:kaptDebugKotlin \
            :app:compileDebugKotlin \
            2>&1 | tee "$LOG_DIR/kotlin-room-kapt-compile.log"

          mkdir -p "$LOG_DIR/room-schemas"

          if [[ -d app/schemas ]]; then
            cp -a app/schemas/. "$LOG_DIR/room-schemas/"
          fi

          find app/schemas -type f -name '*.json' -print 2>/dev/null \
            | tee "$LOG_DIR/room-schema-files.txt"

          test -n "$(find app/schemas -type f -name '*.json' -print -quit 2>/dev/null)"

      - name: Run JVM unit tests
        id: unit_tests
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --stacktrace --console=plain \
            :app:testDebugUnitTest \
            2>&1 | tee "$LOG_DIR/jvm-unit-tests.log"

      - name: Run Android Lint
        id: lint
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --stacktrace --console=plain \
            :app:lintDebug \
            2>&1 | tee "$LOG_DIR/android-lint.log"

      - name: Run API 36 Emulator instrumentation and Room migration tests
        id: instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -Eeuo pipefail

            mkdir -p "$LOG_DIR"

            adb devices -l | tee "$LOG_DIR/emulator-devices.txt"

            adb shell getprop ro.build.version.sdk \
              | tee "$LOG_DIR/emulator-api-level.txt"

            adb shell getprop ro.build.fingerprint \
              | tee "$LOG_DIR/emulator-build-fingerprint.txt"

            gradle --no-daemon --stacktrace --console=plain \
              :app:connectedDebugAndroidTest \
              2>&1 | tee "$LOG_DIR/android-instrumentation.log"

      - name: Assemble final Debug APK
        id: assemble_debug
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --stacktrace --console=plain \
            :app:assembleDebug \
            2>&1 | tee "$LOG_DIR/assemble-debug.log"

          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify Debug APK package, alignment and integrity
        id: verify_apk
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          test -s "$APK"

          "$AAPT" dump badging "$APK" \
            | tee "$LOG_DIR/apk-badging.txt"

          grep -F "package: name='com.aiarchitecture.app'" \
            "$LOG_DIR/apk-badging.txt"

          "$ZIPALIGN" -c -v 4 "$APK" \
            2>&1 | tee "$LOG_DIR/apk-zipalign.txt"

          "$APKSIGNER" verify --verbose "$APK" \
            2>&1 | tee "$LOG_DIR/apk-signature-verification.txt"

          sha256sum "$APK" \
            | tee "$LOG_DIR/debug-apk.sha256"

          stat -c 'APK_SIZE_BYTES=%s' "$APK" \
            | tee "$LOG_DIR/debug-apk-size.txt"

      - name: Create final build summary
        id: final_summary
        if: always()
        shell: bash
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          PROJECT: ${{ steps.project.outcome }}
          JAVA: ${{ steps.java.outcome }}
          GRADLE: ${{ steps.gradle.outcome }}
          SDK: ${{ steps.sdk_packages.outcome }}
          KOTLIN: ${{ steps.kotlin_compiler.outcome }}
          ENVIRONMENT: ${{ steps.environment.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          REFLECTION: ${{ steps.reflection_fixtures.outcome }}
          STATIC: ${{ steps.static_verifiers.outcome }}
          COMPILE_KAPT: ${{ steps.compile_kapt.outcome }}
          UNIT: ${{ steps.unit_tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
          INSTRUMENTATION: ${{ steps.instrumentation.outcome }}
          APK: ${{ steps.assemble_debug.outcome }}
          APK_VERIFY: ${{ steps.verify_apk.outcome }}
        run: |
          set -u

          mkdir -p "$LOG_DIR"
          RESULT=0

          {
            echo "# AI Architecture Android Build Summary"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Project root: ${PROJECT_ROOT:-NOT LOCATED}"
            echo "JDK 17: $JAVA"
            echo "Gradle 8.11.1: $GRADLE"
            echo "Android SDK API 36: $SDK"
            echo "Kotlin PSI compiler 1.9.0: $KOTLIN"
            echo "Environment: $ENVIRONMENT"
            echo "Dependency resolution: $DEPENDENCIES"
            echo "V7 PSI/Tokenizer fixtures: $REFLECTION"
            echo "Static verifiers: $STATIC"
            echo "Kotlin compile + Room KAPT: $COMPILE_KAPT"
            echo "JVM unit tests: $UNIT"
            echo "Android Lint: $LINT"
            echo "API 36 Emulator instrumentation: $INSTRUMENTATION"
            echo "Debug APK assemble: $APK"
            echo "APK verification: $APK_VERIFY"
          } | tee "$LOG_DIR/FINAL_BUILD_SUMMARY.md"

          for outcome in \
            "$CHECKOUT" "$PROJECT" "$JAVA" "$GRADLE" "$SDK" \
            "$KOTLIN" "$ENVIRONMENT" "$DEPENDENCIES" "$REFLECTION" \
            "$STATIC" "$COMPILE_KAPT" "$UNIT" "$LINT" \
            "$INSTRUMENTATION" "$APK" "$APK_VERIFY"
          do
            [[ "$outcome" == "success" ]] || RESULT=1
          done

          if [[ "$RESULT" -eq 0 ]]; then
            echo "FINAL_RESULT=PASS" | tee -a "$LOG_DIR/FINAL_BUILD_SUMMARY.md"
          else
            echo "FINAL_RESULT=FAIL_OR_INCOMPLETE" | tee -a "$LOG_DIR/FINAL_BUILD_SUMMARY.md"
          fi

          exit "$RESULT"

      - name: Upload Debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_Architecture_DEBUG_APK
          if-no-files-found: warn
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload complete build logs, test reports, lint and Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_Architecture_BUILD_LOGS_AND_REPORTS
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: true
          path: |
            ${{ github.workspace }}/.ci-logs/**
            ${{ env.PROJECT_ROOT }}/app/build/reports/**
            ${{ env.PROJECT_ROOT }}/app/build/test-results/**
            ${{ env.PROJECT_ROOT }}/app/build/outputs/androidTest-results/**
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/androidTest/**
            ${{ env.PROJECT_ROOT }}/app/schemas/**
