
name: AI Architecture Android Build, Tests and Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-architecture-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: AI Architecture End-to-End Android CI
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      SOURCE_ZIP_NAME: AI_Architecture_GITHUB_ACTIONS_BUILD_FIXED_V8.zip
      ANDROID_API: '36'
      BUILD_TOOLS_VERSION: '36.0.0'
      GRADLE_VERSION: '8.11.1'
      KOTLIN_COMPILER_VERSION: '1.9.0'
      LOG_DIR: ${{ github.workspace }}/.ci-logs

    steps:

      # 1. Checkout
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      # 2. ZIP extraction and project detection
      - name: Verify ZIP and locate Android project
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$LOG_DIR"

          ZIP="$GITHUB_WORKSPACE/$SOURCE_ZIP_NAME"
          DEST="$RUNNER_TEMP/ai-architecture-source"

          if [[ ! -s "$ZIP" ]]; then
            echo "ERROR: Source ZIP missing: $ZIP"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f
            exit 1
          fi

          unzip -t "$ZIP" 2>&1 | tee "$LOG_DIR/zip-integrity.log"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          unzip -q "$ZIP" -d "$DEST"

          ROOT=""

          while IFS= read -r SETTINGS; do
            CANDIDATE="$(dirname "$SETTINGS")"

            if [[ -f "$CANDIDATE/build.gradle.kts" && \
                  -f "$CANDIDATE/app/build.gradle.kts" && \
                  -f "$CANDIDATE/app/src/main/AndroidManifest.xml" ]]; then
              ROOT="$CANDIDATE"
              break
            fi
          done < <(
            find "$DEST" -maxdepth 12 \
              -type f -name settings.gradle.kts \
              -not -path '*/.gradle/*' -print
          )

          if [[ -z "$ROOT" ]]; then
            echo "ERROR: Valid Android project root not found."
            find "$DEST" -maxdepth 10 -type f \
              | tee "$LOG_DIR/extracted-files.txt"
            exit 1
          fi

          grep -Fq 'com.aiarchitecture.app' \
            "$ROOT/app/build.gradle.kts"

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

          {
            echo "PROJECT_ROOT=$ROOT"
            echo "ZIP_EXTRACTION=PASS"
            echo "PACKAGE_ID=com.aiarchitecture.app"
          } | tee "$LOG_DIR/project-location.txt"

          find "$ROOT" -maxdepth 4 -type f \
            | sort > "$LOG_DIR/project-files.txt"

      # 3. JDK 17
      - name: Set up JDK 17
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Gradle
      - name: Set up Gradle 8.11.1
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: false

      # 5. Detect Android SDK
      - name: Detect Android SDK and sdkmanager
        id: android_sdk
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$LOG_DIR"

          SDK1="${ANDROID_HOME:-}"
          SDK2="${ANDROID_SDK_ROOT:-}"

          if [[ -n "$SDK1" && -n "$SDK2" ]]; then
            if [[ "$(realpath -m "$SDK1")" != "$(realpath -m "$SDK2")" ]]; then
              echo "ERROR: Android SDK roots differ."
              exit 1
            fi
          fi

          SDK_ROOT="${SDK1:-${SDK2:-/usr/local/lib/android/sdk}}"
          SDK_ROOT="$(realpath -m "$SDK_ROOT")"

          test -d "$SDK_ROOT" || {
            echo "ERROR: SDK directory missing: $SDK_ROOT"
            exit 1
          }

          test -d "$SDK_ROOT/cmdline-tools" || {
            echo "ERROR: Android cmdline-tools missing."
            exit 1
          }

          SDKMANAGER="$(
            find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager \
              -perm -u+x -print 2>/dev/null \
              | sort -V | tail -n 1
          )"

          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          {
            echo "SDK_ROOT=$SDK_ROOT"
            echo "SDKMANAGER=$SDKMANAGER"
            "$SDKMANAGER" --version
          } 2>&1 | tee "$LOG_DIR/android-sdk-detection.log"

      # 6. SDK licenses and packages
      - name: Accept licenses and install API 36 packages
        id: sdk_packages
        shell: bash
        run: |
          set -Eeuo pipefail

          set +e
          yes | "$SDKMANAGER" --licenses \
            2>&1 | tee "$LOG_DIR/android-sdk-licenses.log"
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e

          if [[ "$LICENSE_STATUS" -ne 0 ]]; then
            echo "ERROR: SDK license acceptance failed."
            exit "$LICENSE_STATUS"
          fi

          "$SDKMANAGER" \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'emulator' \
            'system-images;android-36;google_apis;x86_64' \
            2>&1 | tee "$LOG_DIR/android-sdk-install.log"

          for FILE in \
            "$ANDROID_HOME/platform-tools/adb" \
            "$ANDROID_HOME/platforms/android-36/android.jar" \
            "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            "$ANDROID_HOME/emulator/emulator"; do
            test -f "$FILE" || {
              echo "ERROR: SDK file missing: $FILE"
              exit 1
            }
          done

          test -d "$ANDROID_HOME/system-images/android-36/google_apis/x86_64"

          "$SDKMANAGER" --list_installed \
            2>&1 | tee "$LOG_DIR/sdk-installed-packages.log"

          echo "SDK_API_36=PASS" \
            | tee "$LOG_DIR/sdk-verification.log"

      # 7. Kotlin PSI compiler
      - name: Install Kotlin PSI compiler 1.9.0
        id: kotlin_compiler
        shell: bash
        run: |
          set -Eeuo pipefail

          DIR="$RUNNER_TEMP/kotlin-compiler-$KOTLIN_COMPILER_VERSION"
          ARCHIVE="$RUNNER_TEMP/kotlin-compiler-$KOTLIN_COMPILER_VERSION.zip"

          rm -rf "$DIR"
          mkdir -p "$DIR"

          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_COMPILER_VERSION}/kotlin-compiler-${KOTLIN_COMPILER_VERSION}.zip" \
            --output "$ARCHIVE"

          unzip -q "$ARCHIVE" -d "$DIR"

          KOTLIN_HOME="$DIR/kotlinc"

          test -x "$KOTLIN_HOME/bin/kotlinc"
          test -s "$KOTLIN_HOME/lib/kotlin-compiler.jar"

          echo "KOTLIN_HOME=$KOTLIN_HOME" >> "$GITHUB_ENV"
          echo "$KOTLIN_HOME/bin" >> "$GITHUB_PATH"

          "$KOTLIN_HOME/bin/kotlinc" -version \
            2>&1 | tee "$LOG_DIR/kotlin-version.log"

          grep -F '1.9.0' "$LOG_DIR/kotlin-version.log"

          sha256sum "$KOTLIN_HOME/lib/kotlin-compiler.jar" \
            | tee "$LOG_DIR/kotlin-compiler.sha256"

      # 8. Environment
      - name: Verify build environment
        id: environment
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            java -version
            gradle --version
            kotlinc -version
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            adb version
            "$SDKMANAGER" --list_installed
          } 2>&1 | tee "$LOG_DIR/environment.log"

          java -version 2>&1 | grep -F '17.'
          gradle --version | grep -F 'Gradle 8.11.1'
          kotlinc -version 2>&1 | grep -F '1.9.0'

          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -s "$KOTLIN_HOME/lib/kotlin-compiler.jar"

      # 9. Gradle task inventory
      - name: Verify Gradle task inventory
        id: gradle_tasks
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --stacktrace --console=plain \
            tasks --all 2>&1 | tee "$LOG_DIR/gradle-root-tasks.log"

          gradle --no-daemon --stacktrace --console=plain \
            :app:tasks --all 2>&1 | tee "$LOG_DIR/gradle-app-tasks.log"

          for TASK in \
            kaptDebugKotlin \
            compileDebugKotlin \
            testDebugUnitTest \
            lintDebug \
            connectedDebugAndroidTest \
            assembleDebug; do

            grep -Eq "(^|[[:space:]])${TASK}([[:space:]]|$)" \
              "$LOG_DIR/gradle-app-tasks.log" || {
                echo "ERROR: Missing Gradle task: $TASK"
                exit 1
              }
          done

      # 10. Dependencies
      - name: Resolve Gradle dependencies
        id: dependencies
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --stacktrace --console=plain \
            :app:dependencies \
            2>&1 | tee "$LOG_DIR/dependencies.log"

      # 11. PSI and Tokenizer
      - name: Run PSI and Tokenizer fixtures
        id: reflection_fixtures
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f scripts/dao_access_guard.py
          test -f scripts/dao_access_guard_psi.kt
          test -f scripts/test_dao_reflection_guard.py

          python3 scripts/test_dao_reflection_guard.py \
            2>&1 | tee "$LOG_DIR/psi-tokenizer-fixtures.log"

          echo "PSI_AND_TOKENIZER_FIXTURES=EXECUTED" \
            | tee "$LOG_DIR/psi-execution-status.log"

      # 12. Static verifiers
      - name: Run static project verifiers
        id: static_verifiers
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          for SCRIPT in \
            scripts/verify_build_readiness.py \
            scripts/verify_project.py \
            scripts/verify_phase2.py \
            scripts/verify_phase2_closeout.py \
            scripts/verify_phase1_sqlite_migrations.py; do

            test -f "$SCRIPT" || {
              echo "ERROR: Missing verifier: $SCRIPT"
              exit 1
            }

            LOG="$LOG_DIR/$(basename "${SCRIPT%.py}").log"

            python3 "$SCRIPT" 2>&1 | tee "$LOG"
          done

      # 13. Kotlin compile and Room schema generation
      - name: Compile Kotlin and Room KAPT
        id: compile_kapt
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Checking Room configuration..."

          python3 - <<'PY'
          import pathlib
          import re
          import sys

          gradle_file = pathlib.Path("app/build.gradle.kts")
          source_file = pathlib.Path(
              "app/src/main/java/com/aiarchitecture/app/data/local/AppDatabase.kt"
          )

          if not gradle_file.is_file() or not source_file.is_file():
              print("ERROR: Room configuration files are missing.")
              sys.exit(1)

          gradle = gradle_file.read_text(encoding="utf-8")
          source = source_file.read_text(encoding="utf-8")

          checks = {
              "KAPT plugin": r'org\.jetbrains\.kotlin\.kapt',
              "Room compiler 2.7.2": r'room-compiler:2\.7\.2',
              "Room schema location": r'room\.schemaLocation',
              "KAPT correctErrorTypes": r'correctErrorTypes\s*=\s*true',
              "Room version 3": r'version\s*=\s*3',
              "Room exportSchema": r'exportSchema\s*=\s*true',
          }

          for label, pattern in checks.items():
              content = gradle if label not in (
                  "Room version 3", "Room exportSchema"
              ) else source

              if not re.search(pattern, content):
                  print(f"ERROR: {label} configuration not found.")
                  sys.exit(1)

              print(f"{label}: PASS")

          print("ROOM_CONFIGURATION=PASS")
          PY

          SCHEMA_DIR="app/schemas"

          rm -rf "$SCHEMA_DIR"
          mkdir -p "$SCHEMA_DIR"

          echo "Running Room KAPT..."

          gradle \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace \
            --console=plain \
            :app:kaptDebugKotlin \
            2>&1 | tee "$LOG_DIR/kotlin-room-kapt.log"

          echo "Checking newly generated Room schema..."

          find "$SCHEMA_DIR" \
            -type f -name '*.json' -print \
            | tee "$LOG_DIR/room-schema-files.log"

          if ! grep -q '\.json$' "$LOG_DIR/room-schema-files.log"; then
            echo "ERROR: Room KAPT did not generate schema JSON."
            tail -n 150 "$LOG_DIR/kotlin-room-kapt.log"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import pathlib
          import sys

          schema_dir = pathlib.Path("app/schemas")
          files = sorted(schema_dir.rglob("*.json"))

          if not files:
              print("ERROR: No Room schema JSON files found.")
              sys.exit(1)

          valid = []

          for path in files:
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"INVALID JSON: {path}: {exc}")
                  sys.exit(1)

              database = data.get("database", {})

              if database.get("version") == 3:
                  valid.append(path)
                  print(f"ROOM_VERSION_3_PASS: {path}")

          if not valid:
              print("ERROR: No valid Room database schema version 3 found.")
              sys.exit(1)

          print(f"ROOM_SCHEMA_JSON_COUNT={len(files)}")
          print("ROOM_SCHEMA_VERSION=3")
          print("ROOM_SCHEMA_VALIDATION=PASS")
          PY

          mkdir -p "$LOG_DIR/room-schemas"
          cp -a "$SCHEMA_DIR/." "$LOG_DIR/room-schemas/"

          echo "ROOM_SCHEMA_GENERATION=PASS" \
            | tee "$LOG_DIR/room-schema-verification.log"

          echo "Compiling Kotlin..."

          gradle \
            --no-daemon \
            --no-build-cache \
            --stacktrace \
            --console=plain \
            :app:compileDebugKotlin \
            2>&1 | tee "$LOG_DIR/kotlin-room-compile.log"

          echo "KOTLIN_ROOM_COMPILE=PASS" \
            | tee "$LOG_DIR/kotlin-room-status.log"

      # 14. JVM tests
      - name: Run JVM unit tests
        id: unit_tests
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --stacktrace --console=plain \
            :app:testDebugUnitTest \
            2>&1 | tee "$LOG_DIR/jvm-unit-tests.log"

          RESULTS="app/build/test-results/testDebugUnitTest"

          test -d "$RESULTS"

          find "$RESULTS" -name 'TEST-*.xml' -type f -print \
            | tee "$LOG_DIR/jvm-test-results.log"

          grep -q . "$LOG_DIR/jvm-test-results.log"

      # 15. Lint
      - name: Run Android Lint
        id: lint
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --stacktrace --console=plain \
            :app:lintDebug \
            2>&1 | tee "$LOG_DIR/android-lint.log"

          find app/build/reports -maxdepth 4 -type f \
            -iname '*lint*' -print \
            | tee "$LOG_DIR/lint-report-files.log"

          grep -q . "$LOG_DIR/lint-report-files.log"

      # 16. Build APK BEFORE emulator tests
      - name: Build Debug APK
        id: assemble_debug
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --stacktrace --console=plain \
            :app:assembleDebug \
            2>&1 | tee "$LOG_DIR/assemble-debug.log"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK" || {
            echo "ERROR: Debug APK missing."
            exit 1
          }

          stat -c 'APK_SIZE_BYTES=%s' "$APK" \
            | tee "$LOG_DIR/apk-size.log"

          sha256sum "$APK" \
            | tee "$LOG_DIR/apk-sha256.log"

      # 17. Verify APK
      - name: Verify APK package, alignment and signature
        id: verify_apk
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_HOME/build-tools/36.0.0"

          test -s "$APK"
          test -x "$BT/aapt"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"

          "$BT/aapt" dump badging "$APK" \
            2>&1 | tee "$LOG_DIR/apk-badging.log"

          grep -F "package: name='com.aiarchitecture.app'" \
            "$LOG_DIR/apk-badging.log"

          "$BT/zipalign" -c -v 4 "$APK" \
            2>&1 | tee "$LOG_DIR/apk-zipalign.log"

          "$BT/apksigner" verify --verbose "$APK" \
            2>&1 | tee "$LOG_DIR/apk-signature.log"

          sha256sum "$APK" \
            | tee "$LOG_DIR/apk-final-sha256.log"

      # 18. Enable KVM before emulator
      - name: Enable and verify KVM hardware acceleration
        id: kvm
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -e /dev/kvm ]]; then
            echo "ERROR: /dev/kvm is unavailable on this runner."
            exit 1
          fi

          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo chmod 666 /dev/kvm

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

          test -r /dev/kvm
          test -w /dev/kvm

          ls -l /dev/kvm \
            | tee "$LOG_DIR/kvm-permissions.log"

          echo "KVM_ACCESS=PASS" \
            | tee "$LOG_DIR/kvm-verification.log"

      # 19. Clear stale ADB server
      - name: Reset ADB before emulator startup
        id: adb_reset
        shell: bash
        run: |
          set -Eeuo pipefail

          adb kill-server || true
          sleep 2
          adb start-server

          adb version \
            | tee "$LOG_DIR/adb-version.log"

          echo "ADB_SERVER_RESET=PASS" \
            | tee "$LOG_DIR/adb-reset.log"

      # 20. API 36 emulator instrumentation tests
      - name: Run API 36 emulator instrumentation tests
        id: instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-boot-timeout: 900
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-audio
            -no-boot-anim
            -no-snapshot
            -wipe-data
            -camera-back none
            -camera-front none
          pre-emulator-launch-script: |
            set -eu

            if [ -e /dev/kvm ]; then
              sudo chmod 666 /dev/kvm
              test -r /dev/kvm
              test -w /dev/kvm
            else
              echo "ERROR: KVM device missing before emulator launch."
              exit 1
            fi
          script: |
            # The action uses /usr/bin/sh for this script.
            # Run Bash explicitly to support pipefail and Bash syntax.
            bash -Eeuo pipefail <<'BASH'

            cd "$PROJECT_ROOT"

            mkdir -p "$LOG_DIR"

            DEVICE="${ANDROID_SERIAL:-emulator-${EMULATOR_PORT:-5554}}"

            echo "=== Emulator device discovery ==="

            adb devices -l \
              | tee "$LOG_DIR/emulator-devices-before-tests.log"

            echo "=== Wait for emulator and recover ADB ==="

            BOOT_OK=0
            OFFLINE_COUNT=0
            ADB_RESTARTED=0
            BOOT_COMPLETED_COUNT=0

            for ATTEMPT in $(seq 1 180); do

              STATE="$(
                adb devices \
                  | awk -v d="$DEVICE" '$1 == d {print $2}'
              )"

              if [[ "$STATE" == "offline" ]]; then

                OFFLINE_COUNT=$((OFFLINE_COUNT + 1))

                echo "ADB offline. Recovery attempt: $OFFLINE_COUNT"

                adb reconnect offline \
                  >/dev/null 2>&1 || true

                if (( OFFLINE_COUNT >= 12 && ADB_RESTARTED == 0 )); then

                  echo "Restarting ADB server..."

                  adb kill-server || true
                  sleep 3
                  adb start-server || true

                  ADB_RESTARTED=1
                  OFFLINE_COUNT=0
                fi

              elif [[ "$STATE" == "device" ]]; then

                BOOT_STATUS="$(
                  adb -s "$DEVICE" shell getprop sys.boot_completed \
                    2>/dev/null | tr -d '\r' || true
                )"

                if [[ "$BOOT_STATUS" == "1" ]]; then

                  BOOT_COMPLETED_COUNT=$((BOOT_COMPLETED_COUNT + 1))

                  if (( BOOT_COMPLETED_COUNT >= 3 )); then
                    BOOT_OK=1
                    break
                  fi

                else
                  BOOT_COMPLETED_COUNT=0
                fi

              else
                BOOT_COMPLETED_COUNT=0
              fi

              if (( ATTEMPT % 12 == 0 )); then
                echo "Waiting for Android boot..."
                echo "Attempt: $ATTEMPT"
                echo "ADB state: ${STATE:-missing}"
                adb devices -l || true
              fi

              sleep 5
            done

            if [[ "$BOOT_OK" -ne 1 ]]; then

              echo "ERROR: Emulator boot did not complete."

              adb devices -l || true

              adb -s "$DEVICE" emu avd name || true

              adb logcat -d -t 1000 \
                > "$LOG_DIR/emulator-logcat-failure.log" 2>&1 || true

              exit 1
            fi

            echo "=== Verify Android API ==="

            API_LEVEL="$(
              adb -s "$DEVICE" shell getprop ro.build.version.sdk \
                | tr -d '\r'
            )"

            echo "EMULATOR_API_LEVEL=$API_LEVEL" \
              | tee "$LOG_DIR/emulator-api-level.log"

            if [[ "$API_LEVEL" != "36" ]]; then
              echo "ERROR: Expected API 36, got $API_LEVEL"
              exit 1
            fi

            adb -s "$DEVICE" shell settings put global \
              window_animation_scale 0

            adb -s "$DEVICE" shell settings put global \
              transition_animation_scale 0

            adb -s "$DEVICE" shell settings put global \
              animator_duration_scale 0

            echo "EMULATOR_BOOT=PASS" \
              | tee "$LOG_DIR/emulator-boot-status.log"

            echo "=== Run connected Android tests ==="

            gradle \
              --no-daemon \
              --stacktrace \
              --console=plain \
              :app:connectedDebugAndroidTest \
              2>&1 | tee "$LOG_DIR/android-instrumentation.log"

            echo "=== Verify instrumentation reports ==="

            RESULTS="app/build/outputs/androidTest-results/connected"

            test -d "$RESULTS" || {
              echo "ERROR: Instrumentation result directory missing."
              exit 1
            }

            find "$RESULTS" -name '*.xml' -type f -print \
              | tee "$LOG_DIR/instrumentation-xml-files.log"

            grep -R -q 'ComponentDatabaseMigrationTest' "$RESULTS" || {
              echo "ERROR: Room migration test result missing."
              exit 1
            }

            grep -R -q 'ComponentPersistenceRoundTripTest' "$RESULTS" || {
              echo "ERROR: Persistence round-trip test result missing."
              exit 1
            }

            echo "ANDROID_INSTRUMENTATION=PASS" \
              | tee "$LOG_DIR/instrumentation-status.log"

            BASH

      # 21. Final summary
      - name: Create final build summary
        id: final_summary
        if: always()
        shell: bash
        env:
          S_CHECKOUT: ${{ steps.checkout.outcome }}
          S_PROJECT: ${{ steps.project.outcome }}
          S_JAVA: ${{ steps.java.outcome }}
          S_GRADLE: ${{ steps.gradle.outcome }}
          S_SDK: ${{ steps.android_sdk.outcome }}
          S_PACKAGES: ${{ steps.sdk_packages.outcome }}
          S_KOTLIN: ${{ steps.kotlin_compiler.outcome }}
          S_ENV: ${{ steps.environment.outcome }}
          S_TASKS: ${{ steps.gradle_tasks.outcome }}
          S_DEPS: ${{ steps.dependencies.outcome }}
          S_GUARD: ${{ steps.reflection_fixtures.outcome }}
          S_STATIC: ${{ steps.static_verifiers.outcome }}
          S_COMPILE: ${{ steps.compile_kapt.outcome }}
          S_JVM: ${{ steps.unit_tests.outcome }}
          S_LINT: ${{ steps.lint.outcome }}
          S_APK: ${{ steps.assemble_debug.outcome }}
          S_APK_VERIFY: ${{ steps.verify_apk.outcome }}
          S_KVM: ${{ steps.kvm.outcome }}
          S_ADB: ${{ steps.adb_reset.outcome }}
          S_ANDROID: ${{ steps.instrumentation.outcome }}
        run: |
          set -Eeuo pipefail

          mkdir -p "$LOG_DIR"

          RESULT=PASS

          for STATUS in \
            "$S_CHECKOUT" "$S_PROJECT" "$S_JAVA" "$S_GRADLE" \
            "$S_SDK" "$S_PACKAGES" "$S_KOTLIN" "$S_ENV" \
            "$S_TASKS" "$S_DEPS" "$S_GUARD" "$S_STATIC" \
            "$S_COMPILE" "$S_JVM" "$S_LINT" "$S_APK" \
            "$S_APK_VERIFY" "$S_KVM" "$S_ADB" "$S_ANDROID"; do

            if [[ "$STATUS" != "success" ]]; then
              RESULT=FAIL_OR_INCOMPLETE
            fi
          done

          {
            echo "# AI Architecture Final CI Summary"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Package: com.aiarchitecture.app"
            echo ""
            echo "Checkout: $S_CHECKOUT"
            echo "Project extraction: $S_PROJECT"
            echo "JDK: $S_JAVA"
            echo "Gradle: $S_GRADLE"
            echo "Android SDK detection: $S_SDK"
            echo "SDK packages: $S_PACKAGES"
            echo "Kotlin PSI compiler: $S_KOTLIN"
            echo "Environment: $S_ENV"
            echo "Gradle tasks: $S_TASKS"
            echo "Dependencies: $S_DEPS"
            echo "PSI/Tokenizer: $S_GUARD"
            echo "Static verifiers: $S_STATIC"
            echo "Kotlin/Room KAPT: $S_COMPILE"
            echo "JVM tests: $S_JVM"
            echo "Android Lint: $S_LINT"
            echo "Debug APK: $S_APK"
            echo "APK verification: $S_APK_VERIFY"
            echo "KVM: $S_KVM"
            echo "ADB reset: $S_ADB"
            echo "Emulator tests: $S_ANDROID"
            echo ""
            echo "FINAL_RESULT=$RESULT"
          } | tee "$LOG_DIR/FINAL_BUILD_SUMMARY.md"

          echo "FINAL_RESULT=$RESULT" >> "$GITHUB_STEP_SUMMARY"

          # The failed build/test step already determines job failure.
          # Keep this summary step informational.
          exit 0

      # 22. Collect artifacts
      - name: Collect APK, logs and reports
        id: collect_artifacts
        if: always()
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -u

          OUT="$GITHUB_WORKSPACE/.ci-artifacts"

          mkdir -p "$OUT/logs"

          if [[ -n "$PROJECT_ROOT" && \
                -s "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk" ]]; then
            mkdir -p "$OUT/apk"

            cp "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk" \
              "$OUT/apk/AI-Architecture-debug.apk"
          fi

          if [[ -d "$LOG_DIR" ]]; then
            cp -a "$LOG_DIR/." "$OUT/logs/" 2>/dev/null || true
          fi

          if [[ -n "$PROJECT_ROOT" ]]; then
            for REL in \
              app/build/reports \
              app/build/test-results \
              app/build/outputs/androidTest-results \
              app/schemas; do

              if [[ -d "$PROJECT_ROOT/$REL" ]]; then
                mkdir -p "$OUT/$(dirname "$REL")"

                cp -a "$PROJECT_ROOT/$REL" "$OUT/$REL" \
                  2>/dev/null || true
              fi
            done
          fi

      # 23. Upload APK
      - name: Upload Debug APK
        id: upload_apk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_Architecture_DEBUG_APK
          path: .ci-artifacts/apk/AI-Architecture-debug.apk
          if-no-files-found: warn
          retention-days: 30

      # 24. Upload reports
      - name: Upload build logs, tests and Room schemas
        id: upload_reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_Architecture_BUILD_LOGS_AND_REPORTS
          path: .ci-artifacts/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
