
name: AI Architecture Android Build and Debug APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-architecture-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Build, PSI, Room, Tests, Emulator and APK
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      ANDROID_API: '36'
      BUILD_TOOLS_VERSION: '36.0.0'
      GRADLE_VERSION: '8.11.1'
      KOTLIN_COMPILER_VERSION: '1.9.0'
      SOURCE_ZIP_NAME: AI_Architecture_GITHUB_ACTIONS_BUILD_FIXED_V8.zip
      LOG_DIR: ${{ github.workspace }}/.ci-logs

    steps:

      # 1. Checkout
      - name: Checkout source
        id: checkout
        uses: actions/checkout@v4

      # 2. Extract and locate Android project
      - name: Extract source ZIP and locate Android project
        id: project
        shell: bash
        run: |
          set -Eeuo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/ai-architecture-source"

          mkdir -p "$LOG_DIR"

          SOURCE_ZIP="$GITHUB_WORKSPACE/$SOURCE_ZIP_NAME"

          if [[ ! -s "$SOURCE_ZIP" ]]; then
            echo "ERROR: Source ZIP not found: $SOURCE_ZIP"

            find "$GITHUB_WORKSPACE" \
              -maxdepth 5 -type f \
              | tee "$LOG_DIR/repository-files.txt"

            exit 1
          fi

          echo "Checking ZIP integrity..."

          unzip -t "$SOURCE_ZIP" \
            2>&1 | tee "$LOG_DIR/zip-integrity.log"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting Android project..."

          unzip -q "$SOURCE_ZIP" -d "$EXTRACT_DIR"

          echo "ZIP_EXTRACTION=PASS"

          PROJECT_ROOT=""

          while IFS= read -r SETTINGS_FILE; do

            CANDIDATE_ROOT="$(dirname "$SETTINGS_FILE")"

            if [[ -f "$CANDIDATE_ROOT/app/build.gradle.kts" ]]; then
              PROJECT_ROOT="$CANDIDATE_ROOT"
              break
            fi

          done < <(
            find "$EXTRACT_DIR" \
              -maxdepth 12 \
              -type f \
              -name settings.gradle.kts \
              -not -path '*/.gradle/*' \
              -print
          )

          if [[ -z "$PROJECT_ROOT" ]]; then
            echo "ERROR: Valid Android project root not found."

            find "$EXTRACT_DIR" \
              -maxdepth 10 -type f \
              | tee "$LOG_DIR/extracted-files.txt"

            exit 1
          fi

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

          {
            echo "PROJECT_ROOT=$PROJECT_ROOT"
            echo "SETTINGS_FILE=$PROJECT_ROOT/settings.gradle.kts"
            echo "APP_BUILD_FILE=$PROJECT_ROOT/app/build.gradle.kts"
            echo "ZIP_EXTRACTION=PASS"
          } | tee "$LOG_DIR/project-location.txt"

          find "$PROJECT_ROOT" \
            -maxdepth 3 -type f \
            | tee "$LOG_DIR/project-files.txt"

      # 3. JDK 17
      - name: Set up JDK 17
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Gradle 8.11.1
      - name: Set up Gradle 8.11.1
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-disabled: false

      # 5. Locate existing Android SDK
      - name: Locate Android SDK command-line tools
        id: android_sdk
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [[ ! -d "$SDK_ROOT" ]]; then
            echo "ERROR: Android SDK not found: $SDK_ROOT"
            exit 1
          fi

          if [[ ! -d "$SDK_ROOT/cmdline-tools" ]]; then
            echo "ERROR: Android command-line tools directory missing"
            exit 1
          fi

          SDKMANAGER="$(
            find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print 2>/dev/null \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "ERROR: Executable sdkmanager not found"
            find "$SDK_ROOT" -maxdepth 6 -type f -name sdkmanager
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          {
            echo "SDK_ROOT=$SDK_ROOT"
            echo "SDKMANAGER=$SDKMANAGER"
            "$SDKMANAGER" --version
          } 2>&1 | tee "$LOG_DIR/android-sdk-tools.log"

      # 6. Install Android SDK packages
      - name: Install Android API 36 and Build Tools
        id: sdk_packages
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$LOG_DIR"

          echo "Accepting SDK licenses..."

          "$SDKMANAGER" --licenses < <(yes) \
            2>&1 | tee "$LOG_DIR/android-sdk-licenses.log"

          echo "Installing Android packages..."

          "$SDKMANAGER" \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'emulator' \
            'system-images;android-36;google_apis;x86_64' \
            2>&1 | tee "$LOG_DIR/android-sdk-install.log"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -d "$ANDROID_HOME/system-images/android-36/google_apis/x86_64"

          echo "ANDROID_SDK_INSTALL=PASS"

      # 7. Kotlin compiler 1.9.0 for PSI guard
      - name: Install Kotlin compiler 1.9.0
        id: kotlin_compiler
        shell: bash
        run: |
          set -Eeuo pipefail

          KOTLIN_DIR="$RUNNER_TEMP/kotlin-compiler-$KOTLIN_COMPILER_VERSION"
          ARCHIVE="$RUNNER_TEMP/kotlin-compiler-$KOTLIN_COMPILER_VERSION.zip"

          rm -rf "$KOTLIN_DIR"
          mkdir -p "$KOTLIN_DIR"

          curl --fail --location --retry 3 \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_COMPILER_VERSION}/kotlin-compiler-${KOTLIN_COMPILER_VERSION}.zip" \
            --output "$ARCHIVE"

          unzip -q "$ARCHIVE" -d "$KOTLIN_DIR"

          KOTLIN_HOME="$KOTLIN_DIR/kotlinc"

          test -x "$KOTLIN_HOME/bin/kotlinc"
          test -s "$KOTLIN_HOME/lib/kotlin-compiler.jar"

          echo "$KOTLIN_HOME/bin" >> "$GITHUB_PATH"
          echo "KOTLIN_HOME=$KOTLIN_HOME" >> "$GITHUB_ENV"

          "$KOTLIN_HOME/bin/kotlinc" -version \
            2>&1 | tee "$LOG_DIR/kotlin-version.log"

          sha256sum "$KOTLIN_HOME/lib/kotlin-compiler.jar" \
            | tee "$LOG_DIR/kotlin-compiler.sha256"

      # 8. Environment verification
      - name: Verify build environment
        id: environment
        shell: bash
        run: |
          set -Eeuo pipefail

          {
            echo "=== JAVA ==="
            java -version

            echo "=== GRADLE ==="
            gradle --version

            echo "=== KOTLIN ==="
            kotlinc -version

            echo "=== ANDROID SDK ==="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

            echo "=== SDK PACKAGES ==="
            "$SDKMANAGER" --list_installed

            echo "=== ADB ==="
            adb version
          } 2>&1 | tee "$LOG_DIR/environment.txt"

          java -version 2>&1 | grep -F '17.'
          gradle --version | grep -F 'Gradle 8.11.1'
          kotlinc -version 2>&1 | grep -F '1.9.0'

          test -s "$KOTLIN_HOME/lib/kotlin-compiler.jar"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      # 9. Resolve Gradle dependencies
      - name: Resolve Gradle dependencies
        id: dependencies
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --stacktrace --console=plain \
            :app:dependencies \
            2>&1 | tee "$LOG_DIR/dependencies.log"

      # 10. PSI and Tokenizer fixtures
      - name: Run PSI and Tokenizer fixtures
        id: reflection_fixtures
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f scripts/dao_access_guard.py
          test -f scripts/test_dao_reflection_guard.py

          python3 scripts/test_dao_reflection_guard.py \
            2>&1 | tee "$LOG_DIR/dao-reflection-fixtures.log"

          grep -F 'PSI_COMPILER=1.9.0' \
            "$LOG_DIR/dao-reflection-fixtures.log"

          grep -F 'PSI_RUNTIME=AVAILABLE' \
            "$LOG_DIR/dao-reflection-fixtures.log"

          grep -F 'PSI_COMPILATION=SUCCESS' \
            "$LOG_DIR/dao-reflection-fixtures.log"

          grep -F 'PSI_FIXTURES=EXECUTED' \
            "$LOG_DIR/dao-reflection-fixtures.log"

          grep -F 'RESULT=TOKENIZER_AND_PSI_FIXTURES_PASS' \
            "$LOG_DIR/dao-reflection-fixtures.log"

          echo "REFLECTION_FIXTURES=PASS"

      # 11. Static project verification
      - name: Run static project verifiers
        id: static_verifiers
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          for script in \
            scripts/verify_build_readiness.py \
            scripts/verify_project.py \
            scripts/verify_phase2.py \
            scripts/verify_phase2_closeout.py \
            scripts/verify_phase1_sqlite_migrations.py
          do
            if [[ ! -f "$script" ]]; then
              echo "ERROR: Required verifier missing: $script"
              exit 1
            fi

            LOG_FILE="$LOG_DIR/$(basename "${script%.py}").log"

            echo "RUNNING: $script"

            python3 "$script" \
              2>&1 | tee "$LOG_FILE"
          done

          echo "STATIC_VERIFIERS=PASS"

      # 12. Kotlin compilation and Room KAPT
      - name: Compile Kotlin and Room KAPT
        id: compile_kapt
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --stacktrace --console=plain \
            :app:kaptDebugKotlin \
            :app:compileDebugKotlin \
            2>&1 | tee "$LOG_DIR/kotlin-room-compile.log"

          mkdir -p "$LOG_DIR/room-schemas"

          if [[ -d app/schemas ]]; then
            cp -a app/schemas/. "$LOG_DIR/room-schemas/"
          fi

          if [[ -d app/schemas ]]; then
            find app/schemas \
              -type f -name '*.json' \
              -print \
              | tee "$LOG_DIR/room-schema-files.txt"
          else
            echo "Room schema directory not generated." \
              | tee "$LOG_DIR/room-schema-files.txt"
          fi

          echo "KOTLIN_COMPILE_AND_KAPT=PASS"

      # 13. JVM tests
      - name: Run JVM unit tests
        id: unit_tests
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --stacktrace --console=plain \
            :app:testDebugUnitTest \
            2>&1 | tee "$LOG_DIR/jvm-unit-tests.log"

      # 14. Android Lint
      - name: Run Android Lint
        id: lint
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --stacktrace --console=plain \
            :app:lintDebug \
            2>&1 | tee "$LOG_DIR/android-lint.log"

      # 15. API 36 emulator tests
      - name: Run API 36 Emulator instrumentation tests
        id: instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -Eeuo pipefail

            cd "$PROJECT_ROOT"

            mkdir -p "$LOG_DIR"

            adb devices -l \
              | tee "$LOG_DIR/emulator-devices.txt"

            adb shell getprop ro.build.version.sdk \
              | tee "$LOG_DIR/emulator-api-level.txt"

            gradle --no-daemon --stacktrace --console=plain \
              :app:connectedDebugAndroidTest \
              2>&1 | tee "$LOG_DIR/android-instrumentation.log"

      # 16. Build Debug APK
      - name: Assemble Debug APK
        id: assemble_debug
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          gradle --no-daemon --stacktrace --console=plain \
            :app:assembleDebug \
            2>&1 | tee "$LOG_DIR/assemble-debug.log"

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "ERROR: Debug APK not generated"
            exit 1
          fi

          echo "DEBUG_APK_BUILD=PASS"

      # 17. APK verification
      - name: Verify APK package, alignment and signature
        id: verify_apk
        working-directory: ${{ steps.project.outputs.project_root }}
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          test -s "$APK"
          test -x "$AAPT"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          "$AAPT" dump badging "$APK" \
            | tee "$LOG_DIR/apk-badging.txt"

          grep -F "package: name='com.aiarchitecture.app'" \
            "$LOG_DIR/apk-badging.txt"

          "$ZIPALIGN" -c -v 4 "$APK" \
            2>&1 | tee "$LOG_DIR/apk-zipalign.txt"

          "$APKSIGNER" verify --verbose "$APK" \
            2>&1 | tee "$LOG_DIR/apk-signature.txt"

          sha256sum "$APK" \
            | tee "$LOG_DIR/debug-apk.sha256"

          stat -c 'APK_SIZE_BYTES=%s' "$APK" \
            | tee "$LOG_DIR/debug-apk-size.txt"

          echo "APK_VERIFICATION=PASS"

      # 18. Final summary
      - name: Create final build summary
        id: final_summary
        if: always()
        shell: bash
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          PROJECT: ${{ steps.project.outcome }}
          JAVA: ${{ steps.java.outcome }}
          GRADLE: ${{ steps.gradle.outcome }}
          SDK_TOOLS: ${{ steps.android_sdk.outcome }}
          SDK: ${{ steps.sdk_packages.outcome }}
          KOTLIN: ${{ steps.kotlin_compiler.outcome }}
          ENVIRONMENT: ${{ steps.environment.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          REFLECTION: ${{ steps.reflection_fixtures.outcome }}
          STATIC: ${{ steps.static_verifiers.outcome }}
          COMPILE: ${{ steps.compile_kapt.outcome }}
          UNIT: ${{ steps.unit_tests.outcome }}
          LINT: ${{ steps.lint.outcome }}
          EMULATOR: ${{ steps.instrumentation.outcome }}
          APK: ${{ steps.assemble_debug.outcome }}
          VERIFY: ${{ steps.verify_apk.outcome }}
        run: |
          set -u

          mkdir -p "$LOG_DIR"
          RESULT=0

          {
            echo "# AI Architecture Android Build Summary"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Project: AI Architecture"
            echo "Package: com.aiarchitecture.app"
            echo ""
            echo "Checkout: $CHECKOUT"
            echo "ZIP Extraction / Project Root: $PROJECT"
            echo "JDK 17: $JAVA"
            echo "Gradle 8.11.1: $GRADLE"
            echo "Android SDK Tools: $SDK_TOOLS"
            echo "Android API 36: $SDK"
            echo "Kotlin Compiler: $KOTLIN"
            echo "Environment: $ENVIRONMENT"
            echo "Dependencies: $DEPENDENCIES"
            echo "PSI and Tokenizer: $REFLECTION"
            echo "Static Verifiers: $STATIC"
            echo "Kotlin and Room KAPT: $COMPILE"
            echo "JVM Tests: $UNIT"
            echo "Android Lint: $LINT"
            echo "Emulator Tests: $EMULATOR"
            echo "Debug APK: $APK"
            echo "APK Verification: $VERIFY"
          } | tee "$LOG_DIR/FINAL_BUILD_SUMMARY.md"

          for status in \
            "$CHECKOUT" "$PROJECT" "$JAVA" "$GRADLE" \
            "$SDK_TOOLS" "$SDK" "$KOTLIN" "$ENVIRONMENT" \
            "$DEPENDENCIES" "$REFLECTION" "$STATIC" "$COMPILE" \
            "$UNIT" "$LINT" "$EMULATOR" "$APK" "$VERIFY"
          do
            [[ "$status" == "success" ]] || RESULT=1
          done

          if [[ "$RESULT" -eq 0 ]]; then
            echo "FINAL_RESULT=PASS" \
              | tee -a "$LOG_DIR/FINAL_BUILD_SUMMARY.md"
          else
            echo "FINAL_RESULT=FAIL_OR_INCOMPLETE" \
              | tee -a "$LOG_DIR/FINAL_BUILD_SUMMARY.md"
          fi

          exit "$RESULT"

      # 19. Prepare artifacts
      - name: Prepare build artifacts
        id: prepare_artifacts
        if: always()
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -u

          ARTIFACT_DIR="$GITHUB_WORKSPACE/.ci-artifacts"

          mkdir -p "$ARTIFACT_DIR/logs"

          if [[ -n "$PROJECT_ROOT" && -s "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk" ]]; then
            mkdir -p "$ARTIFACT_DIR/apk"

            cp "$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk" \
              "$ARTIFACT_DIR/apk/AI-Architecture-debug.apk"
          fi

          if [[ -d "$LOG_DIR" ]]; then
            cp -a "$LOG_DIR/." "$ARTIFACT_DIR/logs/" 2>/dev/null || true
          fi

          if [[ -n "$PROJECT_ROOT" && -d "$PROJECT_ROOT/app/build/reports" ]]; then
            cp -a "$PROJECT_ROOT/app/build/reports" \
              "$ARTIFACT_DIR/" 2>/dev/null || true
          fi

          if [[ -n "$PROJECT_ROOT" && -d "$PROJECT_ROOT/app/build/test-results" ]]; then
            cp -a "$PROJECT_ROOT/app/build/test-results" \
              "$ARTIFACT_DIR/" 2>/dev/null || true
          fi

          if [[ -n "$PROJECT_ROOT" && -d "$PROJECT_ROOT/app/schemas" ]]; then
            cp -a "$PROJECT_ROOT/app/schemas" \
              "$ARTIFACT_DIR/" 2>/dev/null || true
          fi

      # 20. Upload APK
      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_Architecture_DEBUG_APK
          path: .ci-artifacts/apk/AI-Architecture-debug.apk
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      # 21. Upload logs and reports
      - name: Upload build logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_Architecture_BUILD_LOGS_AND_REPORTS
          path: .ci-artifacts/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
