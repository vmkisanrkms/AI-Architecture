
name: AI Architecture Phase 2 Android CI (ZIP upload)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-architecture-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator

      - name: Install Android platform and build tools
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator"

      - name: Verify V1 source ZIP
        run: |
          set -euo pipefail

          ZIP_FILE="AI_Architecture_Phase2_UNIT_TEST_FIX_V1_NOT_FINAL.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::V1 source ZIP not found: $ZIP_FILE"
            ls -la
            exit 1
          fi

          unzip -t "$ZIP_FILE"
          echo "V1 ZIP integrity PASS"

      - name: Extract V1 Android source
        run: |
          set -euo pipefail

          ZIP_FILE="AI_Architecture_Phase2_UNIT_TEST_FIX_V1_NOT_FINAL.zip"
          SOURCE_DIR="$RUNNER_TEMP/ai-architecture-source"
          PROJECT_ROOT="$SOURCE_DIR/AI_Architecture"

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"

          if [ ! -d "$PROJECT_ROOT" ]; then
            echo "::error::AI_Architecture project directory not found"
            find "$SOURCE_DIR" -maxdepth 4 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            echo "::error::settings.gradle.kts missing"
            find "$SOURCE_DIR" -maxdepth 4 -name "settings.gradle*"
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts missing"
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Android project root verified:"
          echo "$PROJECT_ROOT"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Java Gradle and Android SDK
        run: |
          set -euo pipefail

          java -version
          gradle --version
          sdkmanager --list_installed

          test -d "$PROJECT_ROOT"
          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"

      - name: Run all static project verifiers
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          python3 scripts/verify_project.py
          python3 scripts/verify_phase2.py
          python3 scripts/verify_phase2_closeout.py
          python3 scripts/verify_build_readiness.py

      - name: Android debug build
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run unit tests
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Run Android lint
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace :app:lintDebug

      - name: Run emulator instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu

            PROJECT_ROOT="${{ runner.temp }}/ai-architecture-source/AI_Architecture"

            echo "Checking Android project directory:"
            echo "$PROJECT_ROOT"

            cd "$PROJECT_ROOT"

            test -f settings.gradle.kts
            test -f app/build.gradle.kts

            gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Upload APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-architecture-phase2-v1-debug-and-reports
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ai-architecture-source/AI_Architecture/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/ai-architecture-source/AI_Architecture/app/build/reports/**
            ${{ runner.temp }}/ai-architecture-source/AI_Architecture/app/build/test-results/**
            ${{ runner.temp }}/ai-architecture-source/AI_Architecture/app/build/outputs/androidTest-results/**
