
name: AI Architecture Phase 2 Android CI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-architecture-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # 4. Install Android API 36 and Emulator image
      - name: Install Android API 36 and Emulator image
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"

      # 5. Verify source ZIP
      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="AI_Architecture_Phase2_INSTRUMENTATION_FIX_V2_NOT_FINAL.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found: $ZIP_FILE"
            ls -la
            exit 1
          fi

          unzip -t "$ZIP_FILE"
          echo "ZIP integrity PASS"

      # 6. Extract ZIP and detect Android project
      - name: Extract ZIP and detect project root
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="AI_Architecture_Phase2_INSTRUMENTATION_FIX_V2_NOT_FINAL.zip"
          SOURCE_DIR="$RUNNER_TEMP/ai-architecture-source"

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"

          SETTINGS_FILE="$(find "$SOURCE_DIR" -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find "$SOURCE_DIR" -type f -name settings.gradle -print -quit)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found"
            find "$SOURCE_DIR" -maxdepth 7 -type f -print
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_ROOT/app/build.gradle" ]; then
            echo "::error::Android app Gradle file not found"
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "Project root PASS: $PROJECT_ROOT"

      # 7. Setup Gradle 8.11.1
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 8. Verify environment
      - name: Verify Java Gradle and Android SDK
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version
          sdkmanager --list_installed

          test -d "$PROJECT_ROOT"

          test -f "$PROJECT_ROOT/settings.gradle.kts" || \
            test -f "$PROJECT_ROOT/settings.gradle"

          test -f "$PROJECT_ROOT/app/build.gradle.kts" || \
            test -f "$PROJECT_ROOT/app/build.gradle"

          echo "Environment verification PASS"

      # 9. Emulator instrumentation tests FIRST
      - name: Boot Emulator and run instrumentation tests FIRST
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2

          disable-animations: false

          emulator-options: -no-window -no-audio -no-boot-anim

          emulator-boot-timeout: 900

          script: >-
            set -eu;
            SOURCE_DIR="${{ runner.temp }}/ai-architecture-source";
            SETTINGS_FILE="$(find "$SOURCE_DIR" -type f -name settings.gradle.kts -print -quit)";
            if [ -z "$SETTINGS_FILE" ]; then SETTINGS_FILE="$(find "$SOURCE_DIR" -type f -name settings.gradle -print -quit)"; fi;
            test -n "$SETTINGS_FILE";
            PROJECT_ROOT="$(dirname "$SETTINGS_FILE")";
            cd "$PROJECT_ROOT";
            test -f app/build.gradle.kts || test -f app/build.gradle;
            adb wait-for-device;
            BOOTED=0;
            for i in $(seq 1 120); do
              BOOT_STATUS="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)";
              if [ "$BOOT_STATUS" = "1" ]; then BOOTED=1; break; fi;
              sleep 5;
            done;
            if [ "$BOOTED" -ne 1 ]; then echo "Emulator boot verification failed"; adb devices -l; exit 1; fi;
            echo "Emulator boot PASS";
            adb shell input keyevent 82 || true;
            gradle --no-daemon --stacktrace :app:compileDebugAndroidTestKotlin;
            gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest

      # 10. Static project verifiers
      - name: Run all static project verifiers
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          python3 scripts/verify_project.py
          python3 scripts/verify_phase2.py
          python3 scripts/verify_phase2_closeout.py
          python3 scripts/verify_build_readiness.py

          echo "Static verification PASS"

      # 11. Android Debug Build
      - name: Android Debug Build
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          gradle --no-daemon --stacktrace :app:assembleDebug

      # 12. JVM Unit Tests
      - name: Run JVM Unit Tests
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          gradle --no-daemon --stacktrace :app:testDebugUnitTest

      # 13. Android Lint
      - name: Run Android Lint
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          gradle --no-daemon --stacktrace :app:lintDebug

      # 14. Upload APK and reports
      - name: Upload APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-architecture-phase2-debug-and-reports
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ai-architecture-source/**/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/ai-architecture-source/**/app/build/reports/**
            ${{ runner.temp }}/ai-architecture-source/**/app/build/test-results/**
            ${{ runner.temp }}/ai-architecture-source/**/app/build/outputs/androidTest-results/**
