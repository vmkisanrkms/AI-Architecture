
name: AI Architecture Phase 2 Android CI (ZIP upload)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-architecture-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator

      - name: Install Android platform and build tools
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator"

      - name: Verify uploaded ZIP
        run: |
          set -euo pipefail
          ZIP_FILE="AI_Architecture_Phase2_ANDROID_BUILD_READY_NOT_FINAL.zip"
          test -f "$ZIP_FILE"
          unzip -t "$ZIP_FILE"
          echo "Source ZIP integrity PASS"

      - name: Extract uploaded Phase 2 source ZIP
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/ai-architecture-source"

          unzip -q \
            "AI_Architecture_Phase2_ANDROID_BUILD_READY_NOT_FINAL.zip" \
            -d "$RUNNER_TEMP/ai-architecture-source"

          PROJECT_ROOT="$RUNNER_TEMP/ai-architecture-source/AI_Architecture"

          if [ ! -d "$PROJECT_ROOT" ]; then
            echo "::error::Expected AI_Architecture project folder not found."
            find "$RUNNER_TEMP/ai-architecture-source" -maxdepth 3 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_ROOT/settings.gradle" ]; then
            echo "::error::Gradle settings file missing."
            exit 1
          fi

          if [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "::error::Android app module missing."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project extraction PASS"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Java Gradle and Android SDK
        run: |
          set -euo pipefail
          java -version
          gradle --version
          sdkmanager --list_installed
          test -d "$PROJECT_ROOT"

      - name: Run project static verifiers
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          python3 scripts/verify_project.py
          python3 scripts/verify_phase2.py
          python3 scripts/verify_phase2_closeout.py
          python3 scripts/verify_build_readiness.py

      - name: Android debug build
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run unit tests
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Run Android lint
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace :app:lintDebug

      - name: Run emulator instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd "$PROJECT_ROOT"
            gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Upload debug APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-architecture-phase2-debug-build-and-reports
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ai-architecture-source/AI_Architecture/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/ai-architecture-source/AI_Architecture/app/build/reports/**
            ${{ runner.temp }}/ai-architecture-source/AI_Architecture/app/build/test-results/**
            ${{ runner.temp }}/ai-architecture-source/AI_Architecture/app/build/outputs/androidTest-results/**
