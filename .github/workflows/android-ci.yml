name: AI Architecture Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, Tests, Lint, API 36 Emulator and Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ZIP_FILE: AI_Architecture_GITHUB_ACTIONS_BUILD_FINAL.zip
      STATUS_DIR: ${{ github.workspace }}/.ci-ai-architecture-status
      BUNDLE_DIR: ${{ github.workspace }}/.ci-ai-architecture-bundle

    steps:
      # 1. Checkout
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up JDK 17
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK API 36
      - name: Install Android SDK API 36
        id: sdk
        shell: bash
        run: |
          set -Eeuo pipefail

          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -perm -u+x -print -quit)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e

          if [[ "$LICENSE_STATUS" -ne 0 ]]; then
            echo "::error::Android SDK license acceptance failed"
            exit "$LICENSE_STATUS"
          fi

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/system-images/android-36/google_apis/x86_64"

          adb version
          java -version

          echo "ANDROID_SDK_API_36=PASS"

      # 4. Extract the actual uploaded ZIP
      - name: Extract and locate Android project
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP_PATH="$GITHUB_WORKSPACE/$ZIP_FILE"

          if [[ ! -s "$ZIP_PATH" ]]; then
            echo "::error::Expected ZIP not found: $ZIP_FILE"
            echo "Repository files:"
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$BUNDLE_DIR" "$STATUS_DIR"

          echo "Checking ZIP integrity"
          unzip -t "$ZIP_PATH"

          unzip -q "$ZIP_PATH" -d "$BUNDLE_DIR"

          echo "Searching for settings.gradle.kts"

          SETTINGS_FILE="$(find "$BUNDLE_DIR" \
            -type f -name settings.gradle.kts -print -quit)"

          if [[ -z "$SETTINGS_FILE" ]]; then
            SETTINGS_FILE="$(find "$BUNDLE_DIR" \
              -type f -name settings.gradle -print -quit)"
          fi

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::Gradle settings file not found in ZIP"
            find "$BUNDLE_DIR" -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          if [[ ! -s "$PROJECT_ROOT/app/build.gradle.kts" && \
                ! -s "$PROJECT_ROOT/app/build.gradle" ]]; then
            echo "::error::Android app module build file not found"
            exit 1
          fi

          if [[ ! -s "$PROJECT_ROOT/app/src/main/AndroidManifest.xml" ]]; then
            echo "::error::AndroidManifest.xml missing"
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project root: $PROJECT_ROOT"
          echo "ZIP extraction and project detection PASS"

      # 5. Gradle 8.11.1
      - name: Set up Gradle 8.11.1
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify build environment
        id: environment
        shell: bash
        run: |
          set -Eeuo pipefail

          java -version
          gradle --version
          adb version

          test "$(gradle --version | grep -m1 'Gradle 8.11.1' | wc -l)" -eq 1

          echo "JDK17=PASS"
          echo "GRADLE_8_11_1=PASS"
          echo "ANDROID_API_36=PASS"

      # 6. Prepare project workflow for existing static verifier
      - name: Prepare workflow for project verification
        id: prepare
        shell: bash
        run: |
          set -Eeuo pipefail

          WORKFLOW_SOURCE="$GITHUB_WORKSPACE/.github/workflows/android-ci.yml"
          WORKFLOW_DEST="$PROJECT_ROOT/.github/workflows/android-ci.yml"

          if [[ -s "$WORKFLOW_SOURCE" ]]; then
            mkdir -p "$(dirname "$WORKFLOW_DEST")"
            cp "$WORKFLOW_SOURCE" "$WORKFLOW_DEST"
          fi

          echo "Workflow preparation complete"

      # 7. Static verification
      - name: Run existing static verifiers
        id: static
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          for SCRIPT in \
            scripts/verify_project.py \
            scripts/verify_phase2.py \
            scripts/verify_phase2_closeout.py \
            scripts/verify_build_readiness.py
          do
            if [[ ! -s "$SCRIPT" ]]; then
              echo "::error::Required verifier missing: $SCRIPT"
              exit 1
            fi

            echo "========== $SCRIPT =========="
            python3 "$SCRIPT"
          done

          echo "STATIC_VERIFIERS=PASS"

      # 8. Instrumentation configuration
      - name: Verify instrumentation test configuration
        id: test_config
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          APP_GRADLE="app/build.gradle.kts"

          if [[ ! -s "$APP_GRADLE" ]]; then
            APP_GRADLE="app/build.gradle"
          fi

          grep -Fq 'androidx.test.runner.AndroidJUnitRunner' "$APP_GRADLE"
          grep -Fq 'androidTestImplementation' "$APP_GRADLE"

          if [[ ! -d app/src/androidTest ]]; then
            echo "::error::Android instrumentation test directory missing"
            exit 1
          fi

          TEST_COUNT="$(find app/src/androidTest \
            -type f \( -name '*.kt' -o -name '*.java' \) | wc -l)"

          if [[ "$TEST_COUNT" -eq 0 ]]; then
            echo "::error::No instrumentation test source files found"
            exit 1
          fi

          echo "Instrumentation source files: $TEST_COUNT"
          echo "INSTRUMENTATION_CONFIGURATION=PASS"

      # 9. Compile and create Debug APK
      - name: Compile Kotlin and assemble Debug APK
        id: assemble
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          gradle --no-daemon --stacktrace \
            :app:assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::Debug APK was not generated"
            exit 1
          fi

          mkdir -p "$STATUS_DIR"

          cp "$APK" "$STATUS_DIR/app-debug.apk"

          sha256sum "$APK" | tee "$STATUS_DIR/apk-sha256.txt"
          stat -c 'APK_SIZE_BYTES=%s' "$APK" \
            | tee "$STATUS_DIR/apk-size.txt"

          echo "DEBUG_APK_BUILD=PASS"

      # 10. JVM Unit Tests
      - name: Run JVM Unit Tests
        id: unit
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest

          echo "JVM_UNIT_TESTS=PASS"

      # 11. Android Lint
      - name: Run Android Lint
        id: lint
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          gradle --no-daemon --stacktrace \
            :app:lintDebug

          echo "ANDROID_LINT=PASS"

      # 12. Verify APK
      - name: Verify Debug APK
        id: apk_verify
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          test -s "$APK"

          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

          "$BUILD_TOOLS/aapt" dump badging "$APK" \
            | tee "$STATUS_DIR/apk-badging.txt"

          grep -Fq "com.aiarchitecture.app" \
            "$STATUS_DIR/apk-badging.txt"

          sha256sum "$APK" \
            | tee "$STATUS_DIR/apk-final-sha256.txt"

          echo "APK_VERIFICATION=PASS"

      # 13. API 36 Emulator and Instrumentation
      - name: Run API 36 Emulator Instrumentation Tests
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: >-
            -no-window
            -no-audio
            -no-boot-anim
            -no-snapshot
            -gpu swiftshader_indirect
          script: |
            set -Eeuo pipefail

            echo "Checking Android API level"
            adb shell getprop ro.build.version.sdk

            API_LEVEL="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"

            if [[ "$API_LEVEL" != "36" ]]; then
              echo "::error::Expected API 36, received $API_LEVEL"
              exit 1
            fi

            cd "$PROJECT_ROOT"

            gradle --no-daemon --stacktrace \
              :app:connectedDebugAndroidTest

            echo "ANDROID_INSTRUMENTATION=PASS"

      # 14. Final reports
      - name: Collect test and build reports
        id: reports
        if: always()
        shell: bash
        run: |
          set -u

          mkdir -p "$STATUS_DIR"

          {
            echo "========== AI ARCHITECTURE BUILD SUMMARY =========="
            echo "PROJECT=AI Architecture"
            echo "PACKAGE=com.aiarchitecture.app"
            echo "JDK=17"
            echo "GRADLE=8.11.1"
            echo "ANDROID_SDK=36"
            echo "BUILD_TOOLS=36.0.0"
            echo "CHECKOUT=${{ steps.checkout.outcome }}"
            echo "JAVA=${{ steps.java.outcome }}"
            echo "SDK=${{ steps.sdk.outcome }}"
            echo "SOURCE=${{ steps.source.outcome }}"
            echo "GRADLE_SETUP=${{ steps.gradle.outcome }}"
            echo "ENVIRONMENT=${{ steps.environment.outcome }}"
            echo "STATIC=${{ steps.static.outcome }}"
            echo "TEST_CONFIG=${{ steps.test_config.outcome }}"
            echo "ASSEMBLE=${{ steps.assemble.outcome }}"
            echo "UNIT_TESTS=${{ steps.unit.outcome }}"
            echo "LINT=${{ steps.lint.outcome }}"
            echo "APK_VERIFY=${{ steps.apk_verify.outcome }}"
            echo "EMULATOR=${{ steps.emulator.outcome }}"
          } | tee "$STATUS_DIR/final-ci-summary.txt"

          if [[ "${{ steps.checkout.outcome }}" == "success" && \
                "${{ steps.java.outcome }}" == "success" && \
                "${{ steps.sdk.outcome }}" == "success" && \
                "${{ steps.source.outcome }}" == "success" && \
                "${{ steps.gradle.outcome }}" == "success" && \
                "${{ steps.environment.outcome }}" == "success" && \
                "${{ steps.static.outcome }}" == "success" && \
                "${{ steps.test_config.outcome }}" == "success" && \
                "${{ steps.assemble.outcome }}" == "success" && \
                "${{ steps.unit.outcome }}" == "success" && \
                "${{ steps.lint.outcome }}" == "success" && \
                "${{ steps.apk_verify.outcome }}" == "success" && \
                "${{ steps.emulator.outcome }}" == "success" ]]; then

            echo "FINAL_RESULT=PASS" \
              | tee -a "$STATUS_DIR/final-ci-summary.txt"
          else
            echo "FINAL_RESULT=FAIL" \
              | tee -a "$STATUS_DIR/final-ci-summary.txt"
          fi

      # 15. Upload APK and diagnostics even on failure
      - name: Upload Debug APK
        if: always() && steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AI-Architecture-Debug-APK
          path: |
            ${{ env.BUNDLE_DIR }}/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload complete build reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Architecture-Build-Reports
          path: |
            .ci-ai-architecture-status/**
            .ci-ai-architecture-bundle/**/app/build/reports/**
            .ci-ai-architecture-bundle/**/app/build/test-results/**
            .ci-ai-architecture-bundle/**/app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14
