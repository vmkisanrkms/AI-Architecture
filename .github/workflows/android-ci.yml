
name: AI Architecture Phase 2 Android CI (ZIP upload)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-architecture-phase2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator"

      - name: Verify V2 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="AI_Architecture_Phase2_INSTRUMENTATION_FIX_V2_NOT_FINAL.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::V2 source ZIP not found: $ZIP_FILE"
            ls -la
            exit 1
          fi

          unzip -t "$ZIP_FILE"
          echo "V2 ZIP integrity PASS"

      - name: Extract and locate Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="AI_Architecture_Phase2_INSTRUMENTATION_FIX_V2_NOT_FINAL.zip"
          SOURCE_DIR="$RUNNER_TEMP/ai-architecture-source"

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"
          unzip -q "$ZIP_FILE" -d "$SOURCE_DIR"

          SETTINGS_FILE="$(find "$SOURCE_DIR" -type f \( \
            -name settings.gradle.kts -o \
            -name settings.gradle \
          \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Gradle settings file not found"
            find "$SOURCE_DIR" -maxdepth 7 -type f
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_ROOT/app/build.gradle" ]; then
            echo "::error::Android app Gradle file not found"
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "Project root verified: $PROJECT_ROOT"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # FIRST: Emulator instrumentation tests
      - name: Run emulator instrumentation tests FIRST
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu

            SOURCE_DIR="${{ runner.temp }}/ai-architecture-source"

            echo "Finding Android Gradle project..."

            SETTINGS_FILE="$(find "$SOURCE_DIR" -type f \( \
              -name settings.gradle.kts -o \
              -name settings.gradle \
            \) -print -quit)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: Gradle settings file not found"
              exit 1
            fi

            PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

            echo "Project root: $PROJECT_ROOT"
            cd "$PROJECT_ROOT"

            if [ ! -f app/build.gradle.kts ] && \
               [ ! -f app/build.gradle ]; then
              echo "ERROR: Android app Gradle file missing"
              exit 1
            fi

            echo "Waiting for emulator..."
            adb wait-for-device

            BOOT_STATUS=""

            for i in $(seq 1 60); do
              BOOT_STATUS="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"

              if [ "$BOOT_STATUS" = "1" ]; then
                break
              fi

              sleep 5
            done

            if [ "$BOOT_STATUS" != "1" ]; then
              echo "ERROR: Emulator boot timeout"
              adb devices
              exit 1
            fi

            echo "Emulator boot PASS"

            echo "Compiling instrumentation tests..."
            gradle --no-daemon --stacktrace \
              :app:compileDebugAndroidTestKotlin

            echo "Running instrumentation tests..."
            gradle --no-daemon --stacktrace \
              :app:connectedDebugAndroidTest

      - name: Verify Java Gradle and Android SDK
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version
          sdkmanager --list_installed

          test -d "$PROJECT_ROOT"
          test -f "$PROJECT_ROOT/settings.gradle.kts" || \
            test -f "$PROJECT_ROOT/settings.gradle"
          test -f "$PROJECT_ROOT/app/build.gradle.kts" || \
            test -f "$PROJECT_ROOT/app/build.gradle"

      - name: Run all static project verifiers
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          python3 scripts/verify_project.py
          python3 scripts/verify_phase2.py
          python3 scripts/verify_phase2_closeout.py
          python3 scripts/verify_build_readiness.py

      - name: Android debug build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Run Android lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace :app:lintDebug

      - name: Upload APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-architecture-phase2-v2-debug-and-reports
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ai-architecture-source/**/app/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/ai-architecture-source/**/app/build/reports/**
            ${{ runner.temp }}/ai-architecture-source/**/app/build/test-results/**
            ${{ runner.temp }}/ai-architecture-source/**/app/build/outputs/androidTest-results/**
