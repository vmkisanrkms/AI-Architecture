name: AI Architecture Android CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, JVM Tests, Lint and Emulator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STATUS_DIR: ${{ github.workspace }}/.ci-ai-architecture-status
      BUNDLE_DIR: ${{ github.workspace }}/.ci-ai-architecture-bundle

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK without deprecated tools package
        id: sdk
        shell: bash
        run: |
          set -Eeuo pipefail
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager executable not found"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "Using sdkmanager: $SDKMANAGER"
          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e
          if [[ "$LICENSE_STATUS" -ne 0 ]]; then
            echo "::error::SDK license acceptance failed: $LICENSE_STATUS"
            exit "$LICENSE_STATUS"
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            'platform-tools' \
            'platforms;android-35' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'emulator' \
            'system-images;android-35;google_apis;x86_64'
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/system-images/android-35/google_apis/x86_64"
          "$ANDROID_HOME/platform-tools/adb" version
          echo "ANDROID_SDK_INSTALL=PASS"

      - name: Extract uploaded CI bundle and locate project
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$STATUS_DIR"
          ZIP_FILE="$GITHUB_WORKSPACE/AI_Architecture_CI_CORRECTED_COMPLETE_V2.zip"
          if [[ ! -s "$ZIP_FILE" ]]; then
            echo "::error::Required ZIP missing: $ZIP_FILE"
            echo "Upload AI_Architecture_CI_CORRECTED_COMPLETE_V2.zip to repository root."
            ls -lah "$GITHUB_WORKSPACE"
            exit 1
          fi
          unzip -t "$ZIP_FILE"
          rm -rf "$BUNDLE_DIR"
          mkdir -p "$BUNDLE_DIR"
          unzip -q "$ZIP_FILE" -d "$BUNDLE_DIR"
          PROJECT_ROOT="$BUNDLE_DIR/AI_Architecture"
          EMULATOR_SCRIPT="$BUNDLE_DIR/.github/scripts/run-emulator-tests.sh"
          REPORT_SCRIPT="$BUNDLE_DIR/ci/verify-test-reports.py"
          for file in \
            "$PROJECT_ROOT/settings.gradle.kts" \
            "$PROJECT_ROOT/app/build.gradle.kts" \
            "$PROJECT_ROOT/app/src/main/AndroidManifest.xml" \
            "$EMULATOR_SCRIPT" \
            "$REPORT_SCRIPT"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required bundle file missing: $file"
              exit 1
            fi
          done
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "EMULATOR_SCRIPT=$EMULATOR_SCRIPT" >> "$GITHUB_ENV"
          echo "REPORT_SCRIPT=$REPORT_SCRIPT" >> "$GITHUB_ENV"
          chmod +x "$EMULATOR_SCRIPT"
          bash -n "$EMULATOR_SCRIPT"
          python3 -m py_compile "$REPORT_SCRIPT"
          echo "Bundle extraction and validation PASS"

      - name: Set up Gradle 8.11.1
        id: gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify source and run static verifiers
        id: static
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_ROOT"
          python3 scripts/verify_project.py
          python3 scripts/verify_phase2.py
          python3 scripts/verify_phase2_closeout.py
          python3 scripts/verify_build_readiness.py
          echo "Static verification PASS"

      - name: Verify Android instrumentation configuration
        id: test_config
        shell: bash
        run: |
          set -Eeuo pipefail
          APP_GRADLE="$PROJECT_ROOT/app/build.gradle.kts"
          grep -Fq 'androidx.test.runner.AndroidJUnitRunner' "$APP_GRADLE"
          grep -Fq 'androidTestImplementation' "$APP_GRADLE"
          test -d "$PROJECT_ROOT/app/src/androidTest"
          find "$PROJECT_ROOT/app/src/androidTest" -type f \( -name '*.kt' -o -name '*.java' \) -print

      - name: Assemble Debug and Android Test APKs
        id: assemble
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace \
            :app:compileDebugAndroidTestKotlin \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Run JVM Unit Tests
        id: unit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Run Android Lint
        id: lint
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_ROOT"
          gradle --no-daemon --stacktrace :app:lintDebug

      - name: Boot API 35 Emulator and run instrumentation tests
        id: emulator
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PROJECT_ROOT: ${{ env.PROJECT_ROOT }}
          STATUS_DIR: ${{ env.STATUS_DIR }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          EMULATOR_SCRIPT: ${{ env.EMULATOR_SCRIPT }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          emulator-boot-timeout: 900
          script: bash "$EMULATOR_SCRIPT"

      - name: Verify APKs and test reports
        id: reports
        if: always() && steps.source.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$REPORT_SCRIPT" \
            --project-root "$PROJECT_ROOT" \
            --status-dir "$STATUS_DIR"

      - name: Final CI Summary
        id: summary
        if: always()
        shell: bash
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          JAVA: ${{ steps.java.outcome }}
          SDK: ${{ steps.sdk.outcome }}
          SOURCE: ${{ steps.source.outcome }}
          GRADLE: ${{ steps.gradle.outcome }}
          STATIC: ${{ steps.static.outcome }}
          TEST_CONFIG: ${{ steps.test_config.outcome }}
          ASSEMBLE: ${{ steps.assemble.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          LINT: ${{ steps.lint.outcome }}
          EMULATOR: ${{ steps.emulator.outcome }}
          REPORTS: ${{ steps.reports.outcome }}
        run: |
          set -u
          mkdir -p "$STATUS_DIR"
          RESULT=0
          {
            echo 'AI ARCHITECTURE CI SUMMARY'
            echo "CHECKOUT=$CHECKOUT"
            echo "JDK17=$JAVA"
            echo "ANDROID_SDK_SETUP=$SDK"
            echo "SOURCE_BUNDLE=$SOURCE"
            echo "GRADLE=$GRADLE"
            echo "STATIC_VERIFIERS=$STATIC"
            echo "TEST_CONFIGURATION=$TEST_CONFIG"
            echo "APK_ASSEMBLY=$ASSEMBLE"
            echo "JVM_UNIT_TESTS=$UNIT"
            echo "ANDROID_LINT=$LINT"
            echo "EMULATOR_STEP=$EMULATOR"
            echo "REPORT_VERIFICATION=$REPORTS"
          } | tee "$STATUS_DIR/final-ci-summary.txt"
          for value in "$CHECKOUT" "$JAVA" "$SDK" "$SOURCE" "$GRADLE" "$STATIC" "$TEST_CONFIG" "$ASSEMBLE" "$UNIT" "$LINT" "$EMULATOR" "$REPORTS"; do
            [[ "$value" == success ]] || RESULT=1
          done
          if [[ "$RESULT" -eq 0 ]]; then
            echo 'FINAL_RESULT=PASS' | tee -a "$STATUS_DIR/final-ci-summary.txt"
          else
            echo 'FINAL_RESULT=FAIL' | tee -a "$STATUS_DIR/final-ci-summary.txt"
            echo '::error::One or more required CI steps failed'
          fi
          exit "$RESULT"

      - name: Upload APKs, reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-architecture-ci-diagnostics
          if-no-files-found: warn
          path: |
            .ci-ai-architecture-bundle/AI_Architecture/app/build/outputs/apk/**/*.apk
            .ci-ai-architecture-bundle/AI_Architecture/app/build/reports/**
            .ci-ai-architecture-bundle/AI_Architecture/app/build/test-results/**
            .ci-ai-architecture-bundle/AI_Architecture/app/build/outputs/androidTest-results/**
            .ci-ai-architecture-status/**
